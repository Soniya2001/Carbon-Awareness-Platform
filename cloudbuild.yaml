# Google Cloud Build — CarbonWise AI
# Builds Docker image and deploys to Cloud Run

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: carbonwise-ai
  _ARTIFACT_REPO: us-central1-docker.pkg.dev/$PROJECT_ID/carbonwise/carbonwise-ai

steps:
  # ── Step 1: Build Docker image ──────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - '--no-cache'
      - '--build-arg'
      - 'NODE_VERSION=20'
      - '--tag'
      - '${_ARTIFACT_REPO}:$COMMIT_SHA'
      - '--tag'
      - '${_ARTIFACT_REPO}:latest'
      - '--file'
      - 'Dockerfile'
      - '.'

  # ── Step 2: Push to Artifact Registry ──────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - push
      - '--all-tags'
      - '${_ARTIFACT_REPO}'
    waitFor: [build]

  # ── Step 3: Deploy to Cloud Run ─────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_ARTIFACT_REPO}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--port=3000'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1'
    waitFor: [push]

images:
  - '${_ARTIFACT_REPO}:$COMMIT_SHA'
  - '${_ARTIFACT_REPO}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: '1200s'
